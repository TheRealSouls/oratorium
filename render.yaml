services:
  - type: web
    name: oratorium
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENAI_EVALUATION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
